
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArthSpark Live Interactive Demo</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .demo-topbar {
      background: rgba(18, 14, 31, 0.95);
      border-bottom: 1px solid var(--border-glow);
      padding: 12px 0;
      position: sticky;
      top: 0;
      z-index: 90;
    }
    .demo-shell {
      max-width: 1120px;
      margin: 24px auto 60px;
      padding: 0 16px;
    }
    .demo-stage {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px;
    }
    .demo-items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }
    .demo-item-card {
      background: #0d0a18;
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .demo-item-card h4 {
      font-size: 0.98rem;
      margin-bottom: 4px;
    }
    .demo-item-card p {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .cart-panel {
      margin-top: 22px;
      background: #0c0917;
      border: 1px solid var(--border-glow);
      border-radius: 14px;
      padding: 16px;
    }
    .loan-cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 10px;
      margin: 14px 0 18px;
    }
    .loan-type-btn {
      padding: 11px;
      border-radius: 12px;
      background: #0d0a18;
      border: 1px solid var(--border-subtle);
      color: #fff;
      font-weight: 600;
      font-size: 0.84rem;
      cursor: pointer;
      text-align: left;
    }
    .loan-type-btn.active {
      border-color: var(--accent-orange);
      background: rgba(255, 94, 43, 0.14);
    }
    .seat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-width: 280px;
      margin: 14px 0;
    }
    .seat-btn {
      padding: 9px;
      border-radius: 8px;
      background: #0d0a18;
      border: 1px solid var(--border-subtle);
      color: #fff;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .seat-btn.picked {
      background: var(--gradient-brand);
      border-color: transparent;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="demo-topbar">
    <div class="container" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
      <div style="display:flex; align-items:center; gap:10px;">
        <a href="index.html" class="btn btn-outline">&larr; Back to Store</a>
        <div>
          <div style="font-size:0.72rem; color:#ffb48f; font-weight:700;">LIVE INTERACTIVE FRONTEND DEMO</div>
          <strong id="demoHeaderTitle" style="font-size:1rem;">ArthSpark Demo</strong>
        </div>
      </div>
      <div style="display:flex; gap:8px;">
        <button id="demoEnquireWa" class="btn btn-whatsapp" type="button">Order This Project on WhatsApp</button>
      </div>
    </div>
  </div>

  <main class="demo-shell">
    <div id="demoStage" class="demo-stage"></div>
  </main>

  <script src="config.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const type = (params.get("type") || "ecommerce").toLowerCase();
      const title = params.get("title") || "ArthSpark Live Demo";
      const price = params.get("price") || "7999";
      const cfg = window.ARTHSPARK_CONFIG || {};
      const waNum = String(cfg.WHATSAPP_NUMBER || "917978895193").replace(/\D/g, "");

      document.getElementById("demoHeaderTitle").textContent = title;

      function openWa(text) {
        window.open(`https://wa.me/${waNum}?text=${encodeURIComponent(text)}`, "_blank");
      }

      document.getElementById("demoEnquireWa").addEventListener("click", () => {
        openWa(`Hello ArthSpark, I tested the live demo of "${title}" (Price: ₹${price}). Please share setup details!`);
      });

      const stage = document.getElementById("demoStage");

      // 1. Commerce / Grocery / Milk / Veg & Fruits / Restaurant Store Demo
      const STORE_CATALOGS = {
        ecommerce: {
          heading: "ArthSpark Storefront — Live Shopping & Order Flow",
          sub: "Browse products, add to cart, click Buy Now, enter delivery address, and place a live test order.",
          items: [
            { name: "Wireless Smart Watch Pro", desc: "AMOLED Display • Bluetooth Calling", price: 2499 },
            { name: "Noise Cancelling Earbuds", desc: "40H Battery • Fast Charge", price: 1499 },
            { name: "Urban Laptop Backpack", desc: "Waterproof • 15.6-inch Sleeve", price: 1199 },
            { name: "Mechanical Gaming Keyboard", desc: "RGB Backlit • Tactile Keys", price: 2199 }
          ]
        },
        grocery: {
          heading: "ArthSpark Instant Grocery — 15-Min Store Demo",
          sub: "Select daily grocery essentials, add to basket, and complete instant checkout.",
          items: [
            { name: "Premium Basmati Rice (5 kg)", desc: "Aged Long Grain • Farm Fresh", price: 480 },
            { name: "Cold-Pressed Mustard Oil (1 L)", desc: "100% Pure Kachi Ghani", price: 185 },
            { name: "Whole Wheat Chakki Atta (10 kg)", desc: "High Fiber • Soft Rotis", price: 420 },
            { name: "Toor Dal & Spices Combo", desc: "Unpolished Dal + Masala Pack", price: 290 }
          ]
        },
        milk: {
          heading: "ArthSpark Fresh Milk — Daily Morning Subscription Demo",
          sub: "Choose milk pack & morning delivery slot to test subscription ordering.",
          items: [
            { name: "Farm Fresh Full Cream Milk (1 L)", desc: "Morning 6:00 AM Delivery", price: 68 },
            { name: "A2 Desi Cow Milk (1 L)", desc: "Pure Glass Bottle Pack", price: 85 },
            { name: "Fresh Paneer & Curd Pack", desc: "200g Paneer + 400g Dahi", price: 135 },
            { name: "7-Day Morning Milk Pass", desc: "1L Daily • Pause Anytime", price: 460 }
          ]
        },
        veg_fruits: {
          heading: "ArthSpark Sabzi & Fresh Fruits Mandi — Live Demo",
          sub: "Pick farm-fresh vegetables & seasonal fruits and place a test basket order.",
          items: [
            { name: "Daily Sabzi Family Basket (4 kg)", desc: "Potato, Onion, Tomato, Green Veg", price: 220 },
            { name: "Shimla Royal Apples (1 kg)", desc: "Crisp & Sweet Handpicked", price: 160 },
            { name: "Seasonal Fruit Gift Box", desc: "Mango, Pomegranate, Banana, Kiwi", price: 340 },
            { name: "Organic Leafy Greens Pack", desc: "Spinach, Coriander, Methi", price: 75 }
          ]
        },
        restaurant: {
          heading: "ArthSpark Restaurant & Digital Menu — Live Ordering Demo",
          sub: "Tap dishes to add to your table/delivery order and send to kitchen.",
          items: [
            { name: "Paneer Tikka Masala + 2 Butter Naan", desc: "Chef Special Combo", price: 260 },
            { name: "Hyderabadi Dum Biryani", desc: "Served with Raita & Salan", price: 240 },
            { name: "Farmhouse Cheese Burst Pizza", desc: "Medium 10-inch • Fresh Crust", price: 320 },
            { name: "Cold Coffee & Brownie", desc: "Chilled Classic Dessert Combo", price: 180 }
          ]
        }
      };

      if (STORE_CATALOGS[type]) {
        const data = STORE_CATALOGS[type];
        let cart = [];

        function renderStoreDemo() {
          const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
          stage.innerHTML = `
            <h2 class="section-heading">${data.heading}</h2>
            <p class="section-sub">${data.sub}</p>
            <div class="demo-items-grid">
              ${data.items
                .map(
                  (it, idx) => `
                  <div class="demo-item-card">
                    <div>
                      <h4>${it.name}</h4>
                      <p>${it.desc}</p>
                    </div>
                    <div>
                      <div style="font-weight:800; color:var(--accent-gold); margin-bottom:8px;">₹${it.price}</div>
                      <div style="display:flex; gap:6px;">
                        <button class="btn btn-outline add-cart-btn" data-idx="${idx}" type="button" style="flex:1;">+ Cart</button>
                        <button class="btn btn-primary buy-item-btn" data-idx="${idx}" type="button" style="flex:1;">Buy Now</button>
                      </div>
                    </div>
                  </div>`
                )
                .join("")}
            </div>

            <div class="cart-panel" id="checkoutSection">
              <h3 style="font-size:1.05rem; margin-bottom:8px;">Live Cart &amp; Checkout (${cart.reduce((s, i) => s + i.qty, 0)} items)</h3>
              ${
                cart.length
                  ? `<div style="margin-bottom:12px;">
                      ${cart
                        .map(
                          (c, i) =>
                            `<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border-subtle); font-size:0.86rem;">
                              <span>${c.name} x ${c.qty}</span>
                              <span>₹${c.price * c.qty} <button data-rem="${i}" class="rem-btn" style="margin-left:8px; color:#ff7b7b; background:none; border:none; cursor:pointer;">Remove</button></span>
                            </div>`
                        )
                        .join("")}
                      <div style="margin-top:10px; font-weight:800; color:var(--accent-gold);">Total Payable: ₹${total}</div>
                    </div>`
                  : `<p style="font-size:0.84rem; color:var(--text-secondary); margin-bottom:12px;">Cart is empty. Click "+ Cart" or "Buy Now" on any product above.</p>`
              }

              <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px; margin-bottom:12px;">
                <input id="demoCustName" type="text" placeholder="Customer Name" style="padding:10px; border-radius:8px; background:#120e1f; border:1px solid var(--border-subtle); color:#fff;" />
                <input id="demoCustAddr" type="text" placeholder="Delivery Address / City" style="padding:10px; border-radius:8px; background:#120e1f; border:1px solid var(--border-subtle); color:#fff;" />
              </div>
              <button id="placeDemoOrderBtn" class="btn btn-primary" type="button">Place Test Order Now</button>
              <div id="demoOrderReceipt" style="margin-top:12px;"></div>
            </div>
          `;

          stage.querySelectorAll(".add-cart-btn").forEach((b) => {
            b.addEventListener("click", () => {
              const item = data.items[Number(b.getAttribute("data-idx"))];
              const existing = cart.find((c) => c.name === item.name);
              if (existing) existing.qty += 1;
              else cart.push({ ...item, qty: 1 });
              renderStoreDemo();
            });
          });

          stage.querySelectorAll(".buy-item-btn").forEach((b) => {
            b.addEventListener("click", () => {
              const item = data.items[Number(b.getAttribute("data-idx"))];
              cart = [{ ...item, qty: 1 }];
              renderStoreDemo();
              document.getElementById("checkoutSection").scrollIntoView({ behavior: "smooth" });
            });
          });

          stage.querySelectorAll(".rem-btn").forEach((b) => {
            b.addEventListener("click", () => {
              cart.splice(Number(b.getAttribute("data-rem")), 1);
              renderStoreDemo();
            });
          });

          document.getElementById("placeDemoOrderBtn").addEventListener("click", () => {
            if (!cart.length) {
              alert("Please select at least 1 product first!");
              return;
            }
            const cname = document.getElementById("demoCustName").value || "Demo Customer";
            const caddr = document.getElementById("demoCustAddr").value || "Ranchi, Jharkhand";
            const orderId = "AS-" + Math.floor(100000 + Math.random() * 900000);
            document.getElementById("demoOrderReceipt").innerHTML = `
              <div style="background:rgba(30,190,93,0.14); border:1px solid #1ebe5d; padding:12px; border-radius:10px; font-size:0.86rem;">
                <strong>Order Confirmed! (${orderId})</strong><br/>
                Customer: ${cname} • Address: ${caddr} • Total: ₹${total}<br/>
                <em>This is how your customers will place orders on your ArthSpark website!</em>
              </div>
            `;
          });
        }
        renderStoreDemo();
        return;
      }

      // 2. Loan Hub Interactive Demo (Personal, Business, Mortgage, Car New/Old, Bike New/Old)
      if (type === "loan") {
        const LOAN_TYPES = [
          "Personal Loan",
          "Business Loan",
          "Mortgage Loan",
          "New Car Loan",
          "Old Car Loan",
          "New Bike Loan",
          "Old Bike Loan"
        ];
        let activeLoan = LOAN_TYPES[0];

        function renderLoanDemo() {
          stage.innerHTML = `
            <h2 class="section-heading">ArthSpark Loan Hub — All Loan Categories Demo</h2>
            <p class="section-sub">Select any loan category below, calculate EMI, and test instant loan application flow:</p>

            <div class="loan-cat-grid">
              ${LOAN_TYPES.map(
                (lt) =>
                  `<button class="loan-type-btn ${lt === activeLoan ? "active" : ""}" data-lt="${lt}" type="button">${lt}</button>`
              ).join("")}
            </div>

            <div class="cart-panel">
              <h3 style="margin-bottom:10px;">Apply for: <span style="color:var(--accent-gold);">${activeLoan}</span></h3>
              <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px; margin-bottom:12px;">
                <div>
                  <label style="font-size:0.78rem; color:var(--text-secondary);">Loan Amount (₹)</label>
                  <input id="loanAmt" type="number" value="250000" style="width:100%; padding:10px; border-radius:8px; background:#120e1f; border:1px solid var(--border-subtle); color:#fff;" />
                </div>
                <div>
                  <label style="font-size:0.78rem; color:var(--text-secondary);">Tenure (Months)</label>
                  <input id="loanMonths" type="number" value="36" style="width:100%; padding:10px; border-radius:8px; background:#120e1f; border:1px solid var(--border-subtle); color:#fff;" />
                </div>
                <div>
                  <label style="font-size:0.78rem; color:var(--text-secondary);">Applicant Name</label>
                  <input id="loanApplicant" type="text" placeholder="Full Name" style="width:100%; padding:10px; border-radius:8px; background:#120e1f; border:1px solid var(--border-subtle); color:#fff;" />
                </div>
              </div>
              <div style="display:flex; flex-wrap:wrap; gap:10px;">
                <button id="calcEmiBtn" class="btn btn-outline" type="button">Calculate EMI</button>
                <button id="submitLoanDemoBtn" class="btn btn-primary" type="button">Submit ${activeLoan} Request</button>
              </div>
              <div id="loanDemoOut" style="margin-top:12px;"></div>
            </div>
          `;

          stage.querySelectorAll(".loan-type-btn").forEach((b) => {
            b.addEventListener("click", () => {
              activeLoan = b.getAttribute("data-lt");
              renderLoanDemo();
            });
          });

          document.getElementById("calcEmiBtn").addEventListener("click", () => {
            const p = Number(document.getElementById("loanAmt").value) || 100000;
            const n = Number(document.getElementById("loanMonths").value) || 24;
            const r = 11.5 / 12 / 100;
            const emi = Math.round((p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1));
            document.getElementById("loanDemoOut").innerHTML = `<p style="color:var(--accent-gold); font-weight:700;">Estimated Monthly EMI for ${activeLoan}: ₹${emi.toLocaleString("en-IN")}/month</p>`;
          });

          document.getElementById("submitLoanDemoBtn").addEventListener("click", () => {
            const name = document.getElementById("loanApplicant").value || "Applicant";
            const amt = document.getElementById("loanAmt").value || "250000";
            document.getElementById("loanDemoOut").innerHTML = `
              <div style="background:rgba(30,190,93,0.14); border:1px solid #1ebe5d; padding:12px; border-radius:10px; font-size:0.86rem;">
                <strong>Application Logged!</strong> ${name}'s request for <strong>${activeLoan}</strong> (₹${Number(amt).toLocaleString("en-IN")}) is ready for instant WhatsApp/CRM routing.
              </div>
            `;
          });
        }
        renderLoanDemo();
        return;
      }

      // 3. Travel / Hotel / Bus / Flight / Ride (Rapido/Ola/Uber) Interactive Demo
      if (["hotel", "bus", "flight", "ride", "tour"].includes(type)) {
        let pickedSeats = ["S2"];
        stage.innerHTML = `
          <h2 class="section-heading">${title} — Interactive Booking Demo</h2>
          <p class="section-sub">Test route/destination selection, ride/seat picker, and instant fare confirmation.</p>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px; margin:14px 0;">
            <input id="fromCity" type="text" value="Ranchi" placeholder="From / Pickup" style="padding:10px; border-radius:8px; background:#0d0a18; border:1px solid var(--border-subtle); color:#fff;" />
            <input id="toCity" type="text" value="Patna" placeholder="To / Destination" style="padding:10px; border-radius:8px; background:#0d0a18; border:1px solid var(--border-subtle); color:#fff;" />
            <select id="rideClass" style="padding:10px; border-radius:8px; background:#0d0a18; border:1px solid var(--border-subtle); color:#fff;">
              <option value="499">Bike / Standard Saver — ₹499</option>
              <option value="899">AC Sleeper / Sedan Cab — ₹899</option>
              <option value="2499">Deluxe Suite / Express Flight — ₹2,499</option>
            </select>
          </div>
          ${
            type === "bus" || type === "flight"
              ? `<div><strong style="font-size:0.85rem;">Tap to Select Seats:</strong>
                  <div class="seat-grid" id="seatGrid">
                    ${["S1", "S2", "S3", "S4", "S5", "S6", "S7", "S8"]
                      .map((s) => `<button type="button" class="seat-btn ${pickedSeats.includes(s) ? "picked" : ""}" data-s="${s}">${s}</button>`)
                      .join("")}
                  </div>
                </div>`
              : ""
          }
          <button id="confirmTravelBtn" class="btn btn-primary" type="button">Confirm Live Booking Demo</button>
          <div id="travelOut" style="margin-top:14px;"></div>
        `;

        stage.querySelectorAll(".seat-btn").forEach((sb) => {
          sb.addEventListener("click", () => {
            const s = sb.getAttribute("data-s");
            if (pickedSeats.includes(s)) pickedSeats = pickedSeats.filter((x) => x !== s);
            else pickedSeats.push(s);
            sb.classList.toggle("picked");
          });
        });

        document.getElementById("confirmTravelBtn").addEventListener("click", () => {
          const from = document.getElementById("fromCity").value;
          const to = document.getElementById("toCity").value;
          const fare = document.getElementById("rideClass").value;
          document.getElementById("travelOut").innerHTML = `
            <div style="background:rgba(30,190,93,0.14); border:1px solid #1ebe5d; padding:12px; border-radius:10px; font-size:0.86rem;">
              <strong>Booking Confirmed!</strong> ${from} &rarr; ${to} | Fare: ₹${fare} ${type === "bus" || type === "flight" ? "| Seats: " + pickedSeats.join(", ") : ""}
            </div>
          `;
        });
        return;
      }

      // 4. Banking / Payment Gateway / School / Real Estate / Partners / IT & Marketing Demo
      stage.innerHTML = `
        <h2 class="section-heading">${title} — Interactive System Preview</h2>
        <p class="section-sub">Explore live interactive modules built for this solution by ArthSpark.</p>
        <div class="demo-items-grid">
          <div class="demo-item-card">
            <h4>Customer / User Frontend</h4>
            <p>Clean mobile-first interface with instant search, filters, and one-tap actions.</p>
            <span class="maint-tag">Active Module</span>
          </div>
          <div class="demo-item-card">
            <h4>Live Checkout &amp; WhatsApp Routing</h4>
            <p>Direct payment gateway trigger + pre-filled WhatsApp lead alert for every user.</p>
            <span class="maint-tag">Active Module</span>
          </div>
          <div class="demo-item-card">
            <h4>Admin Control &amp; Analytics</h4>
            <p>Manage rates, banners, entries, and customer requests directly from mobile or laptop.</p>
            <span class="maint-tag">Active Module</span>
          </div>
        </div>
        <div class="cart-panel">
          <h3 style="font-size:1rem; margin-bottom:8px;">Test Instant Inquiry / Action</h3>
          <div style="display:flex; flex-wrap:wrap; gap:10px;">
            <input id="genDemoInput" type="text" placeholder="Enter sample name / ID / query..." style="flex:1; min-width:200px; padding:10px; border-radius:8px; background:#120e1f; border:1px solid var(--border-subtle); color:#fff;" />
            <button id="genDemoBtn" class="btn btn-primary" type="button">Run Action</button>
          </div>
          <div id="genDemoResult" style="margin-top:10px;"></div>
        </div>
      `;

      document.getElementById("genDemoBtn").addEventListener("click", () => {
        const val = document.getElementById("genDemoInput").value || "Sample Entry #101";
        document.getElementById("genDemoResult").innerHTML = `
          <div style="background:rgba(30,190,93,0.14); border:1px solid #1ebe5d; padding:10px; border-radius:10px; font-size:0.85rem;">
            <strong>Processed Successfully:</strong> "${val}" recorded in ${title} workflow!
          </div>
        `;
      });
    })();
  </script>
</body>
</html>
