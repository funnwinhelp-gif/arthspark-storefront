<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArthSpark Live Demo</title>
  <style>
    :root {
      --bg-canvas: #0b0e14;
      --bg-card: #151b26;
      --bg-panel: #0e121a;
      --border-soft: rgba(255, 255, 255, 0.1);
      --border-gold: rgba(230, 190, 122, 0.42);
      --text-main: #f3f5f8;
      --text-muted: #9aa4b5;
      --gold: #e6be7a;
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0b0e14 !important;
      background-image: radial-gradient(circle at 75% 15%, rgba(56, 120, 175, 0.15), transparent 42%);
      color: #f3f5f8 !important;
      line-height: 1.55;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 18px;
    }

    .topbar {
      background: rgba(11, 14, 20, 0.94);
      border-bottom: 1px solid var(--border-soft);
      padding: 12px 0;
      position: sticky;
      top: 0;
      z-index: 90;
    }

    .shell {
      max-width: 1120px;
      margin: 22px auto 60px;
      padding: 0 18px;
    }

    .stage {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .heading {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: var(--radius-md);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .btn-demo {
      background: #2b313c;
      color: #e8ecf2 !important;
    }

    .btn-emerald {
      background: linear-gradient(135deg, #0f5c49 0%, #178267 100%);
      color: #ffffff !important;
    }

    .btn-indigo {
      background: linear-gradient(135deg, #32408c 0%, #4859b8 100%);
      color: #ffffff !important;
    }

    .btn-wa {
      background: #178256;
      color: #ffffff !important;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 14px;
    }

    .item-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .item-card h4 {
      font-size: 0.98rem;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .item-card p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .price-txt {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .panel {
      margin-top: 20px;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 16px;
    }

    .loan-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .loan-btn {
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      color: #f3f5f8;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    .loan-btn.active {
      border-color: var(--border-gold);
      color: var(--gold);
      background: #1c2434;
    }

    .seat-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-width: 260px;
      margin: 12px 0;
    }

    .seat-btn {
      padding: 8px;
      border-radius: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      color: #f3f5f8;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .seat-btn.picked {
      background: #178267;
      color: #ffffff;
      border-color: transparent;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
      <div style="display:flex; align-items:center; gap:10px;">
        <a href="index.html" class="btn btn-demo">&larr; Back</a>
        <div>
          <div style="font-size:0.7rem; color:var(--gold); font-weight:700;">LIVE DEMO</div>
          <strong id="demoTitle" style="font-size:0.98rem; color:#ffffff;">ArthSpark Demo</strong>
        </div>
      </div>
      <button id="demoWaBtn" class="btn btn-wa" type="button">Enquire on WhatsApp</button>
    </div>
  </div>

  <main class="shell">
    <div id="stage" class="stage"></div>
  </main>

  <script src="config.js"></script>
  <script>
    (function () {
      const q = new URLSearchParams(window.location.search);
      const type = (q.get("type") || "ecommerce").toLowerCase();
      const title = q.get("title") || "ArthSpark Demo";
      const price = q.get("price") || "7999";
      const cfg = window.ARTHSPARK_CONFIG || {};
      const wa = String(cfg.WHATSAPP_NUMBER || "917978895193").replace(/\D/g, "");

      document.getElementById("demoTitle").textContent = title;
      document.getElementById("demoWaBtn").addEventListener("click", () => {
        window.open(`https://wa.me/${wa}?text=${encodeURIComponent(`Hello ArthSpark, I checked "${title}" demo (₹${price}).`)}`, "_blank");
      });

      const stage = document.getElementById("stage");

      const CATALOGS = {
        ecommerce: {
          h: "E-Commerce Storefront Demo",
          s: "Add items to cart or click Buy Now to test checkout.",
          items: [
            { name: "Smart Watch Pro", desc: "AMOLED Display • Calling", price: 2499 },
            { name: "Wireless Earbuds", desc: "Fast Charge • Clear Audio", price: 1499 },
            { name: "Travel Laptop Bag", desc: "Water Resistant • 15.6-inch", price: 1199 },
            { name: "Mechanical Keyboard", desc: "Compact • Tactile Keys", price: 2199 }
          ]
        },
        grocery: {
          h: "Instant Grocery Store Demo",
          s: "Pick daily essentials and test order placement.",
          items: [
            { name: "Basmati Rice (5 kg)", desc: "Aged Long Grain", price: 480 },
            { name: "Mustard Oil (1 L)", desc: "Pure Kachi Ghani", price: 185 },
            { name: "Chakki Atta (10 kg)", desc: "Whole Wheat Flour", price: 420 },
            { name: "Toor Dal & Spices", desc: "Daily Kitchen Pack", price: 290 }
          ]
        },
        milk: {
          h: "Daily Milk Subscription Demo",
          s: "Choose milk pack and test daily delivery order.",
          items: [
            { name: "Full Cream Milk (1 L)", desc: "Morning 6:00 AM Slot", price: 68 },
            { name: "Desi Cow Milk (1 L)", desc: "Farm Fresh Pack", price: 85 },
            { name: "Paneer & Curd Combo", desc: "Fresh Dairy Pack", price: 135 },
            { name: "7-Day Milk Pass", desc: "1L Daily Schedule", price: 460 }
          ]
        },
        veg_fruits: {
          h: "Vegetables & Fresh Fruits Demo",
          s: "Select produce packs and test checkout.",
          items: [
            { name: "Daily Sabzi Basket (4 kg)", desc: "Potato, Onion, Tomato, Veg", price: 220 },
            { name: "Royal Apples (1 kg)", desc: "Fresh Orchard Pack", price: 160 },
            { name: "Mixed Fruit Box", desc: "Seasonal Assortment", price: 340 },
            { name: "Leafy Greens Pack", desc: "Fresh Daily Greens", price: 75 }
          ]
        },
        restaurant: {
          h: "Restaurant & Table Menu Demo",
          s: "Add dishes and test order confirmation.",
          items: [
            { name: "Paneer Tikka + Naan", desc: "Chef Special Meal", price: 260 },
            { name: "Dum Biryani", desc: "Served with Raita", price: 240 },
            { name: "Cheese Burst Pizza", desc: "10-inch Fresh Crust", price: 320 },
            { name: "Cold Coffee & Brownie", desc: "Dessert Combo", price: 180 }
          ]
        }
      };

      if (CATALOGS[type]) {
        const d = CATALOGS[type];
        let cart = [];
        function drawStore() {
          const total = cart.reduce((s, x) => s + x.price * x.qty, 0);
          stage.innerHTML = `
            <h2 class="heading">${d.h}</h2>
            <p class="sub">${d.s}</p>
            <div class="items-grid">
              ${d.items.map((it, i) => `
                <div class="item-card">
                  <div>
                    <h4>${it.name}</h4>
                    <p>${it.desc}</p>
                  </div>
                  <div>
                    <div class="price-txt">₹${it.price}</div>
                    <div style="display:flex; gap:8px;">
                      <button type="button" class="btn btn-demo add-b" data-i="${i}" style="flex:1;">+ Cart</button>
                      <button type="button" class="btn btn-emerald buy-b" data-i="${i}" style="flex:1;">Buy Now</button>
                    </div>
                  </div>
                </div>`).join("")}
            </div>
            <div class="panel" id="cartBox">
              <strong style="color:#ffffff;">Cart (${cart.reduce((s, x) => s + x.qty, 0)} items)</strong>
              <div style="margin:10px 0; font-size:0.86rem;">
                ${cart.length
                  ? cart.map((c, idx) => `<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border-soft);"><span>${c.name} x ${c.qty}</span><span>₹${c.price * c.qty} <button type="button" data-d="${idx}" class="rm-b" style="margin-left:8px; background:none; border:none; color:#f87171; cursor:pointer;">Remove</button></span></div>`).join("") +
                    `<div style="margin-top:10px; color:var(--gold); font-weight:700;">Total: ₹${total}</div>`
                  : `<span style="color:var(--text-muted);">No items in cart yet.</span>`}
              </div>
              <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px; margin-bottom:10px;">
                <input id="cName" type="text" placeholder="Your Name" style="padding:9px 11px; border-radius:8px; background:#151b26; border:1px solid var(--border-soft); color:#fff;" />
                <input id="cCity" type="text" placeholder="Delivery Address" style="padding:9px 11px; border-radius:8px; background:#151b26; border:1px solid var(--border-soft); color:#fff;" />
              </div>
              <button id="placeOrd" type="button" class="btn btn-emerald">Place Test Order</button>
              <div id="ordMsg" style="margin-top:10px;"></div>
            </div>`;

          stage.querySelectorAll(".add-b").forEach((b) => b.addEventListener("click", () => {
            const item = d.items[Number(b.getAttribute("data-i"))];
            const found = cart.find((x) => x.name === item.name);
            if (found) found.qty += 1; else cart.push({ ...item, qty: 1 });
            drawStore();
          }));
          stage.querySelectorAll(".buy-b").forEach((b) => b.addEventListener("click", () => {
            cart = [{ ...d.items[Number(b.getAttribute("data-i"))], qty: 1 }];
            drawStore();
            document.getElementById("cartBox").scrollIntoView({ behavior: "smooth" });
          }));
          stage.querySelectorAll(".rm-b").forEach((b) => b.addEventListener("click", () => {
            cart.splice(Number(b.getAttribute("data-d")), 1);
            drawStore();
          }));
          document.getElementById("placeOrd").addEventListener("click", () => {
            if (!cart.length) { alert("Add an item first."); return; }
            const nm = document.getElementById("cName").value || "Customer";
            const ct = document.getElementById("cCity").value || "Ranchi";
            document.getElementById("ordMsg").innerHTML = `<div style="padding:10px; border-radius:8px; background:rgba(23,130,86,0.18); border:1px solid #178256; font-size:0.85rem;">Order placed for <strong>${nm}</strong> (${ct}) • Total: <strong>₹${total}</strong></div>`;
          });
        }
        drawStore();
        return;
      }

      if (type === "loan") {
        const types = ["Personal Loan", "Business Loan", "Mortgage Loan", "New Car Loan", "Old Car Loan", "New Bike Loan", "Old Bike Loan"];
        let active = types[0];
        function drawLoan() {
          stage.innerHTML = `
            <h2 class="heading">Loan Hub Demo</h2>
            <p class="sub">Select loan category, check EMI, and test application flow.</p>
            <div class="loan-grid">
              ${types.map((t) => `<button type="button" class="loan-btn ${t === active ? "active" : ""}" data-t="${t}">${t}</button>`).join("")}
            </div>
            <div class="panel">
              <div style="margin-bottom:10px; font-weight:700; color:var(--gold);">${active}</div>
              <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(175px, 1fr)); gap:10px; margin-bottom:12px;">
                <input id="lAmt" type="number" value="200000" placeholder="Amount (₹)" style="padding:9px 11px; border-radius:8px; background:#151b26; border:1px solid var(--border-soft); color:#fff;" />
                <input id="lTen" type="number" value="24" placeholder="Months" style="padding:9px 11px; border-radius:8px; background:#151b26; border:1px solid var(--border-soft); color:#fff;" />
                <input id="lName" type="text" placeholder="Applicant Name" style="padding:9px 11px; border-radius:8px; background:#151b26; border:1px solid var(--border-soft); color:#fff;" />
              </div>
              <div style="display:flex; flex-wrap:wrap; gap:10px;">
                <button id="emiBtn" type="button" class="btn btn-demo">Calculate EMI</button>
                <button id="appBtn" type="button" class="btn btn-indigo">Submit Request</button>
              </div>
              <div id="lRes" style="margin-top:10px;"></div>
            </div>`;
          stage.querySelectorAll(".loan-btn").forEach((b) => b.addEventListener("click", () => {
            active = b.getAttribute("data-t");
            drawLoan();
          }));
          document.getElementById("emiBtn").addEventListener("click", () => {
            const p = Number(document.getElementById("lAmt").value) || 100000;
            const n = Number(document.getElementById("lTen").value) || 24;
            const r = 11.5 / 12 / 100;
            const emi = Math.round((p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1));
            document.getElementById("lRes").innerHTML = `<span style="color:var(--gold); font-weight:700;">Estimated EMI for ${active}: ₹${emi.toLocaleString("en-IN")}/month</span>`;
          });
          document.getElementById("appBtn").addEventListener("click", () => {
            const nm = document.getElementById("lName").value || "Applicant";
            document.getElementById("lRes").innerHTML = `<div style="padding:10px; border-radius:8px; background:rgba(23,130,86,0.18); border:1px solid #178256; font-size:0.85rem;">Request submitted for <strong>${nm}</strong> — <strong>${active}</strong>.</div>`;
          });
        }
        drawLoan();
        return;
      }

      let seats = ["S1"];
      stage.innerHTML = `
        <h2 class="heading">${title}</h2>
        <p class="sub">Interactive module preview &amp; live action test.</p>
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px; margin-bottom:12px;">
          <input id="f1" type="text" value="Ranchi" style="padding:9px 11px; border-radius:8px; background:#0e121a; border:1px solid var(--border-soft); color:#fff;" />
          <input id="f2" type="text" value="Patna" style="padding:9px 11px; border-radius:8px; background:#0e121a; border:1px solid var(--border-soft); color:#fff;" />
          <select id="f3" style="padding:9px 11px; border-radius:8px; background:#0e121a; border:1px solid var(--border-soft); color:#fff;">
            <option value="499">Standard Plan — ₹499</option>
            <option value="999">Business Plan — ₹999</option>
            <option value="2499">Enterprise Plan — ₹2,499</option>
          </select>
        </div>
        ${["bus", "flight"].includes(type) ? `<div class="seat-row">${["S1","S2","S3","S4","S5","S6","S7","S8"].map((s) => `<button type="button" class="seat-btn ${seats.includes(s) ? "picked" : ""}" data-s="${s}">${s}</button>`).join("")}</div>` : ""}
        <button id="runDemoAct" type="button" class="btn btn-emerald">Confirm Demo Action</button>
        <div id="demoActOut" style="margin-top:12px;"></div>
      `;
      stage.querySelectorAll(".seat-btn").forEach((b) => b.addEventListener("click", () => {
        const s = b.getAttribute("data-s");
        seats = seats.includes(s) ? seats.filter((x) => x !== s) : [...seats, s];
        b.classList.toggle("picked");
      }));
      document.getElementById("runDemoAct").addEventListener("click", () => {
        document.getElementById("demoActOut").innerHTML = `<div style="padding:10px; border-radius:8px; background:rgba(23,130,86,0.18); border:1px solid #178256; font-size:0.85rem;">Action completed: <strong>${document.getElementById("f1").value}</strong> to <strong>${document.getElementById("f2").value}</strong> (₹${document.getElementById("f3").value}).</div>`;
      });
    })();
  </script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connecting to WhatsApp | ArthSpark</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0e14;
      color: #f3f5f8;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .box {
      max-width: 400px;
      background: #151b26;
      border: 1px solid rgba(226, 184, 110, 0.42);
      border-radius: 16px;
      padding: 24px;
    }
    a.wa-btn {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 18px;
      border-radius: 10px;
      background: #178256;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2 style="margin:0 0 8px;">Opening WhatsApp...</h2>
    <p id="statusMsg" style="margin:0; color:#9aa4b5; font-size:0.9rem;">Redirecting you to ArthSpark WhatsApp support.</p>
    <a id="manualWaLink" class="wa-btn" href="#">Open WhatsApp Now</a>
  </div>

  <script src="config.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const title = params.get("title") || "ArthSpark Project";
      const price = params.get("price") || "";
      const cfg = window.ARTHSPARK_CONFIG || {};
      const waNumber = String(cfg.WHATSAPP_NUMBER || "917978895193").replace(/\D/g, "");

      const msg = price
        ? `Hello ArthSpark, I clicked Live Demo for "${title}" (Offer Price: ₹${Number(price).toLocaleString("en-IN")}). Please share demo & details.`
        : `Hello ArthSpark, I clicked Live Demo for "${title}". Please share demo & details.`;

      const waUrl = `https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`;
      document.getElementById("manualWaLink").href = waUrl;
      window.location.replace(waUrl);
    })();
  </script>
</body>
</html>
